name: diag-wikidata
on:
  push:
    branches: [fix/wikidata-city-classes]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv python install 3.12 && uv sync --all-extras --frozen
      - name: Fetch with new filter
        run: |
          set -o pipefail
          old=$(git show HEAD:data/processed/cities/ru_cities.csv | wc -l)
          start=$(date +%s)
          uv run cns fetch-pop 2>&1 | tee f.log || { echo "::error title=fetch::$(tail -c 1500 f.log | tr '\n' ' ')"; exit 1; }
          new=$(wc -l < data/processed/cities/ru_cities.csv)
          uv run python - <<'P'
          import pandas as pd
          c = pd.read_csv("data/processed/cities/ru_cities.csv", dtype={"oktmo": str})
          o = pd.read_csv("old.csv", dtype={"oktmo": str}) if False else None
          big = c.sort_values("population_latest", ascending=False).head(40)
          print("::notice title=top40::" + ", ".join(big["name"]))
          print("::notice title=coverage::" + str(c["coverage"].value_counts().to_dict()) + " nocoord=" + str(int(c["lat"].isna().sum())))
          P
          echo "::notice title=counts::old=$old new=$new secs=$(( $(date +%s)-start ))"
          git diff --stat | tail -1 | sed 's/^/::notice title=diff::/'
          comm -13 <(git show HEAD:data/processed/cities/ru_cities.csv | cut -d, -f2 | sort) <(cut -d, -f2 data/processed/cities/ru_cities.csv | sort) | head -150 | tr '\n' ',' | sed 's/^/::notice title=added::/'
          echo
          comm -23 <(git show HEAD:data/processed/cities/ru_cities.csv | cut -d, -f2 | sort) <(cut -d, -f2 data/processed/cities/ru_cities.csv | sort) | tr '\n' ',' | sed 's/^/::notice title=removed::/'
