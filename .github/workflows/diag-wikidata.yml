name: diag-wikidata
on:
  push:
    branches: [fix/wikidata-city-classes]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Classes of added items
        run: |
          cat > q.rq <<'Q'
          SELECT ?c ?name ?p31 ?p31Label ?rank ?end ?start WHERE {
            VALUES ?name { "Бугры"@ru "Колтуши"@ru "Кокшайск"@ru "Сукромны"@ru "Свияжск"@ru "Старая Ладога"@ru "Старочеркасская"@ru "Наурская"@ru "Шелковская"@ru "Серноводское"@ru "Ойсхара"@ru "Углеуральский"@ru "Краснобродский"@ru "Ожерелье"@ru "Железнодорожный"@ru "Абакан"@ru "Нея"@ru "Колпино"@ru "Щёлкино"@ru "Тольятти"@ru }
            ?c rdfs:label ?name ; wdt:P17 wd:Q159 ; wdt:P764 [] ; p:P31 ?s .
            ?s ps:P31 ?p31 ; wikibase:rank ?rank .
            OPTIONAL { ?s pq:P582 ?end } OPTIONAL { ?s pq:P580 ?start }
            SERVICE wikibase:label { bd:serviceParam wikibase:language "ru,en". }
          }
          Q
          curl -sS -G https://query.wikidata.org/sparql -H 'Accept: text/csv' -H 'User-Agent: CitiesNeverSleep-diag (https://github.com/Gregory-Bondarenko/cities-never-sleep)' --data-urlencode query@q.rq > out.csv
          python3 - <<'P'
          import csv, collections
          by = collections.defaultdict(list)
          for r in csv.DictReader(open("out.csv")):
              e = (" до "+r["end"][:4]) if r["end"] else ""; s = (" с "+r["start"][:4]) if r["start"] else ""
              by[r["name"]].append(f'{r["p31"].rsplit("/",1)[-1]} {r["p31Label"]} [{r["rank"].rsplit("#",1)[-1][:4]}{s}{e}]')
          lines = [f"{n}: " + "; ".join(sorted(set(v))) for n, v in sorted(by.items())]
          chunk = []
          for i in range(0, len(lines), 2):
              print("::notice title=p31 " + str(i) + "::" + " || ".join(lines[i:i+2])[:1000])
          P
