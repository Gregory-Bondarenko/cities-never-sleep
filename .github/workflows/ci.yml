name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Ruff
        run: uv run ruff check analytics tests

      - name: Pytest
        run: uv run pytest -q

      - name: CLI dry-run
        run: |
          uv run cns version
          uv run cns fetch-vnl --dry-run --years 2013,2022
          uv run cns fetch-pop --dry-run
