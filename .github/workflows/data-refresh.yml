name: data-refresh

# Обновление артефактов из внешних источников на раннере GitHub.
# Результат пушится в ветку data/refresh-<источник>-<дата>-<запуск>,
# из которой открывается PR с типом data. В main напрямую ничего не пишется.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Что обновить"
        required: true
        default: wikidata
        type: choice
        options: [wikidata, lights]
      years:
        description: "Годы для lights"
        required: false
        default: "2012-2024"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras --frozen

      - name: Fetch Wikidata
        if: inputs.source == 'wikidata'
        run: uv run cns fetch-pop | tee fetch.log

      - name: Build city lights
        if: inputs.source == 'lights'
        run: |
          for y in $(uv run python -c "from citiesneversleep.sources.vnl_zenodo import parse_years_spec as p; print(*p('${{ inputs.years }}'))"); do
            uv run cns fetch-vnl --year "$y"
            uv run cns process-vnl --year "$y"
            rm -f data/raw/vnl/*_s_${y}0101_*.tif
          done
          uv run cns build-lights --years "${{ inputs.years }}" | tee fetch.log

      - name: Push branch
        id: push
        run: |
          branch="data/refresh-${{ inputs.source }}-$(date -u +%Y%m%d)-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/processed
          if git diff --cached --quiet; then
            echo "::notice title=data-refresh::Изменений нет"
            exit 0
          fi
          stat=$(git diff --cached --stat | tail -1)
          git commit -m "data: обновление ${{ inputs.source }} $(date -u +%Y-%m-%d)" -m "Запуск ${{ github.run_id }}"
          git push origin "$branch"
          summary="ветка $branch%0A$stat%0A$(sed ':a;N;$!ba;s/\n/%0A/g' fetch.log)"
          echo "::notice title=data-refresh::$summary"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
