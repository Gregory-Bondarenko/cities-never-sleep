name: reproduce

# Полный прогон `make all` на чистой машине: проверка воспроизводимости.
# Запускается вручную, результат сравнивается с выгрузкой в репозитории.

on:
  workflow_dispatch:
    inputs:
      years:
        description: Годы VNL
        default: 2012-2024

permissions:
  contents: read

jobs:
  make-all:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv python install 3.12
      - name: Remove committed derived data
        run: rm -rf data/processed/lights data/processed/trends data/processed/cities data/processed/population web/dist
      - name: make all
        run: |
          set -o pipefail
          make all YEARS="${{ inputs.years }}" 2>&1 | tee run.log | tail -n 60
      - name: Compare with repository
        run: uv run python scripts/reproduce_report.py
      - name: Report failure
        if: failure()
        run: echo "::error title=reproduce::$(tail -c 1500 run.log | tr '\n' ' ')"
