[project]
name = "cities-never-sleep"
version = "1.0.0.dev0"
description = "Города не спят / Cities Never Sleep — динамика ночной освещённости городов России по VIIRS и сравнение с населением"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Gregory Bondarenko" }]
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "rasterio>=1.3",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "tqdm>=4.66",
  "rich>=13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
cns = "citiesneversleep.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analytics/citiesneversleep"]

[tool.hatch.build.targets.wheel.sources]
"analytics" = ""

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["analytics", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["analytics"]
